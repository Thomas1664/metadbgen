stages:
  - prepare
  - build-image
  - test

compute-hash:
  stage: prepare
  script:
    - export ENV_HASH=$(cat Dockerfile environment.yml requirements.txt | sha256sum | cut -c1-12)
    - echo "ENV_HASH=${ENV_HASH}" >> build.env
  artifacts:
    reports:
      dotenv: build.env

build-image:
  stage: build-image
  needs: [compute-hash]
  image: docker:latest
  services:
    - docker:dind
  variables:
    DOCKER_DRIVER: overlay
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - export IMAGE_TAG=$IMAGE_NAME
    - docker build -t "$CI_REGISTRY_IMAGE:$IMAGE_COMMIT_TAG" --pull -f Dockerfile .
    - docker push $CI_REGISTRY_IMAGE:$IMAGE_COMMIT_TAG
  rules:
    - changes:
        - Dockerfile
        - environment.yml
        - requirements.txt
        - .gitlab-ci.yml

tests:
  stage: test
  dependencies:
    - compute-hash
    - build-image
  image: ${CI_REGISTRY_IMAGE}/conda-env:${ENV_HASH}
  variables:
    SQLITE_DB: data/primer_blast_cache.sqlite
    CACHE_KEY: "sqlite-$CI_COMMIT_REF_SLUG"
  script:
    - source activate cox2-db
    - snakemake -s cox2-db.smk -c 8 --configfile config.yml --keep-incomplete
    - python ./parse_snakemake_log.py --output data/cox2_th/workflow-stats.json
    - python ./pipeline-stats-plot.py --base data/cox2_th --rank order --out data/cox2_th/pipeline-stats --colormap colormap-oom-order.csv
    - python ./pipeline-stats-plot.py --base data/cox2_th/outgroups --rank phylum --out data/cox2_th/pipeline-stats-outgroup
    - pytest
  artifacts:
    when: always
    paths:
      - data/cox2_th
    exclude:
      - data/primer_blast_cache.sqlite
      - data/cox2_th/taxonomy/tax_db.sqlite
      - data/cox2_th/round2/tmp/*.gb
      - data/cox2_th/outgroups/primer-trim/cutadapt-info.tsv
      - data/cox2_th/outgroups/primer-trim/cutadapt-info-tmp.tsv
      - data/cox2_th/outgroups/primer-trim/cutadapt-info-parsed.tsv
  cache:
    key: "$CACHE_KEY"
    paths:
      - $SQLITE_DB
    policy: pull-push

# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/ee/user/application_security/sast/#customizing-the-sast-settings
# Secret Detection customization: https://docs.gitlab.com/ee/user/application_security/secret_detection/pipeline/#customization
# Dependency Scanning customization: https://docs.gitlab.com/ee/user/application_security/dependency_scanning/#customizing-the-dependency-scanning-settings
# Container Scanning customization: https://docs.gitlab.com/ee/user/application_security/container_scanning/#customizing-the-container-scanning-settings
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ee/ci/variables/#cicd-variable-precedence
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
